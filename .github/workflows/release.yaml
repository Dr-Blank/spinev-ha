name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      # Home Assistant reads the running version from the manifest, so a tag
      # that disagrees with it ships an integration that reports the wrong one.
      - name: Verify the tag matches both versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          project="v$(uv version --short)"
          manifest="v$(python3 -c 'import json; print(json.load(open("custom_components/spinev/manifest.json"))["version"])')"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag $tag does not match pyproject.toml version $project"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match manifest.json version $manifest"
            exit 1
          fi

      - name: Test
        run: uv run pytest

  release:
    name: Release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Create the GitHub release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, skipping"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --generate-notes
